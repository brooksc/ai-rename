[pytest]
testpaths = tests
python_files = test_*.py
addopts = 
    --verbose
    --cov=ai_rename
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    --timeout=30
    -n auto

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests 